name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Синтаксис bash
        run: |
          for f in install.sh run.sh stop.sh status.sh tools/*.sh; do
            bash -n "$f"
            echo "bash -n $f: OK"
          done

      - name: shellcheck
        run: shellcheck --severity=warning install.sh run.sh stop.sh status.sh tools/*.sh

      - name: Синтаксис Python и JSON (tools/)
        run: |
          python3 -m py_compile tools/*.py
          # Пример настроек групп проверяем тем же валидатором, что и рабочий
          # конфиг: так в CI ловится опечатка в ключе (например `site` вместо
          # `sites`) и дубль slug, а не только синтаксис JSON.
          python3 -c "
          import importlib.util, json
          spec = importlib.util.spec_from_file_location('grafana_groups', 'tools/grafana-groups.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.validate_config(json.load(open('tools/grafana-groups.example.json', encoding='utf-8')))
          print('grafana-groups.example.json OK')
          "

      - name: Ротация логов по размеру (run.sh --rotate-now)
        run: |
          set -euo pipefail
          LOG_DIR="$RUNNER_TEMP/logs"; DATA_DIR="$RUNNER_TEMP/data"
          export LOG_DIR DATA_DIR
          rm -rf "$LOG_DIR" "$DATA_DIR"; mkdir -p "$LOG_DIR" "$DATA_DIR"

          # 1) файл больше предела — обрезается, хвост (последние строки) остаётся
          seq 1 5000 | sed 's/^/line /' > "$LOG_DIR/prometheus.log"
          before=$(stat -c %s "$LOG_DIR/prometheus.log")
          LOG_MAX_SIZE=10K LOG_KEEP_PERCENT=10 ./run.sh --rotate-now
          after=$(stat -c %s "$LOG_DIR/prometheus.log")
          echo "prometheus.log: $before -> $after байт"
          [ "$after" -lt "$before" ] || { echo "::error::лог не обрезан"; exit 1; }
          [ "$after" -le 4096 ] || { echo "::error::хвост больше ожидаемого"; exit 1; }
          # без `... | grep -q`: при pipefail grep -q закрывает pipe и tail
          # получает SIGPIPE — проверка была бы плавающей
          last="$(tail -1 "$LOG_DIR/prometheus.log")"
          [ "$last" = "line 5000" ] || { echo "::error::потерян хвост лога (последняя строка: $last)"; exit 1; }

          # 2) маленький файл не трогаем, LOG_MAX_SIZE=0 выключает ротацию
          echo small > "$LOG_DIR/grafana.log"
          LOG_MAX_SIZE=0 ./run.sh --rotate-now
          [ "$(cat "$LOG_DIR/grafana.log")" = small ] \
            || { echo "::error::тронут маленький лог"; exit 1; }

          # 3) писатель с O_APPEND продолжает писать в тот же файл после обрезки
          #    (это и позволяет обрезать логи без перезапуска сервисов)
          ( i=0; while [ "$i" -lt 300 ]; do
              i=$((i + 1))
              printf 'writer %04d\n' "$i" >> "$LOG_DIR/snmp_exporter.log"
              sleep 0.02
            done ) &
          writer=$!
          sleep 0.5
          LOG_MAX_SIZE=1K ./run.sh --rotate-now
          size1=$(stat -c %s "$LOG_DIR/snmp_exporter.log")
          sleep 1
          size2=$(stat -c %s "$LOG_DIR/snmp_exporter.log")
          kill "$writer" 2>/dev/null || true
          wait "$writer" 2>/dev/null || true
          echo "snmp_exporter.log после обрезки: $size1 -> $size2 байт"
          [ "$size2" -gt "$size1" ] \
            || { echo "::error::писатель не продолжил писать после обрезки"; exit 1; }
          last="$(tail -1 "$LOG_DIR/snmp_exporter.log")"
          case "$last" in
            writer\ [0-9]*) : ;;
            *) echo "::error::файл повреждён обрезкой (последняя строка: $last)"; exit 1 ;;
          esac

          # 4) фоновый ротатор держит размер под пределом у болтливого сервиса
          ( i=0; while [ "$i" -lt 600 ]; do
              i=$((i + 1))
              printf 'chatty %04d: scrape error\n' "$i" >> "$LOG_DIR/prometheus.log"
              sleep 0.01
            done ) &
          writer2=$!
          LOG_MAX_SIZE=2K LOG_KEEP_PERCENT=10 LOG_CHECK_INTERVAL=5 \
            ./run.sh --rotate-daemon >"$RUNNER_TEMP/rotate.log" 2>&1 &
          daemon=$!
          sleep 9
          max_seen=0
          for _ in $(seq 1 20); do
            s=$(stat -c %s "$LOG_DIR/prometheus.log")
            [ "$s" -gt "$max_seen" ] && max_seen=$s
            sleep 0.1
          done
          kill "$daemon" "$writer2" 2>/dev/null || true
          wait "$daemon" 2>/dev/null || true
          wait "$writer2" 2>/dev/null || true
          echo "максимальный размер под ротатором: $max_seen байт (предел 2048)"
          cat "$RUNNER_TEMP/rotate.log"
          [ "$max_seen" -le 16384 ] \
            || { echo "::error::ротатор не сдержал размер лога"; exit 1; }
          [ -s "$RUNNER_TEMP/rotate.log" ] \
            || { echo "::error::ротатор ничего не сделал"; exit 1; }

      - name: JSON дашборда Grafana
        run: |
          jq -e . grafana/dashboards/ups-overview.json > /dev/null
          echo "dashboard JSON OK"

      - name: Семантика дашборда (id, раскладка, ссылки, копии групп)
        run: python3 tools/check-dashboard.py

      - name: Версии в документации
        run: python3 tools/check-versions.py

      - name: CHANGELOG для тега
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 tools/check-versions.py --tag "$GITHUB_REF_NAME"

      - name: YAML (конфиги и provisioning)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c 'import sys, yaml; [yaml.safe_load(open(f, encoding="utf-8")) for f in sys.argv[1:]]' \
            prometheus.yml \
            targets.yml \
            snmp.yml \
            grafana/provisioning/datasources/datasource.yml \
            grafana/provisioning/dashboards/dashboards.yml
          echo "YAML OK"

      - name: promtool check config
        run: |
          PROM_VER="$(sed -n 's/^PROM_VER="\([^"]*\)".*/\1/p' run.sh | head -n 1)"
          echo "Prometheus $PROM_VER"
          curl -fsSL --retry 3 -o /tmp/prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v$PROM_VER/prometheus-$PROM_VER.linux-amd64.tar.gz"
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          /tmp/prometheus-"$PROM_VER".linux-amd64/promtool check config prometheus.yml

      - name: PromQL из дашборда Grafana
        run: |
          PROM_VER="$(sed -n 's/^PROM_VER="\([^"]*\)".*/\1/p' run.sh | head -n 1)"
          python3 - <<'PY'
          import importlib.util, json, pathlib, re
          exprs = []

          def walk(items):
              for panel in items:
                  for target in panel.get('targets', []):
                      if target.get('expr'):
                          exprs.append(target['expr'])
                  walk(panel.get('panels', []))

          dashboards = sorted(pathlib.Path('grafana/dashboards').glob('*.json'))
          for path in dashboards:
              walk(json.loads(path.read_text(encoding='utf-8'))['panels'])

          # Отдельно проверяем выражения копии группы: в них фильтр доступа
          # подставлен жёстко, рядом с ссылкой на переменную — это два матчера
          # по одной метке. Невалидное выражение здесь означало бы, что группа
          # видит не то, что должна.
          spec = importlib.util.spec_from_file_location(
              'grafana_groups', 'tools/grafana-groups.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          for path in dashboards:
              base = json.loads(path.read_text(encoding='utf-8'))
              for slug, regex, sites in (('ci-loc', 'Узел.*', None),
                                         # название со спецсимволами RE2 — проверяем
                                         # экранирование, а не только простой случай
                                         ('ci-site', None, ['Площадка №1', 'ЦОД-1 (основной)'])):
                  copy, _, _ = module.make_group_dashboard(
                      base, slug, 'CI', regex, sites=sites)
                  walk(copy['panels'])

          # переменные Grafana -> значения, чтобы выражение стало валидным PromQL
          uniq = sorted({re.sub(r'\s+', ' ', e).replace('$ups', 'UPS-01')
                         .replace('$site', 'Площадка №1')
                         .replace('$instance', '192.168.1.10') for e in exprs})
          lines = ['groups:', '  - name: dashboard', '    rules:']
          for i, expr in enumerate(uniq):
              lines += [f'      - record: check_{i:03d}', f"        expr: '{expr}'"]
          pathlib.Path('/tmp/dashboard-rules.yml').write_text('\n'.join(lines) + '\n',
                                                              encoding='utf-8')
          print(f'выражений в дашбордах и копиях групп: {len(uniq)}')
          PY
          /tmp/prometheus-"$PROM_VER".linux-amd64/promtool check rules /tmp/dashboard-rules.yml

      - name: Загрузка snmp.yml экспортёром
        run: |
          SNMP_VER="$(sed -n 's/^SNMP_VER="\([^"]*\)".*/\1/p' run.sh | head -n 1)"
          echo "snmp_exporter $SNMP_VER"
          curl -fsSL --retry 3 -o /tmp/snmp_exporter.tar.gz \
            "https://github.com/prometheus/snmp_exporter/releases/download/v$SNMP_VER/snmp_exporter-$SNMP_VER.linux-amd64.tar.gz"
          tar -xzf /tmp/snmp_exporter.tar.gz -C /tmp
          # порт 0 — случайный свободный, чтобы не мешать другим процессам раннера
          timeout 5 /tmp/snmp_exporter-"$SNMP_VER".linux-amd64/snmp_exporter \
            --config.file=snmp.yml --web.listen-address=127.0.0.1:0 > /tmp/snmp_exporter.log 2>&1 || true
          cat /tmp/snmp_exporter.log
          grep -q 'Starting snmp_exporter' /tmp/snmp_exporter.log
          if grep -qiE 'level=error|Error loading config' /tmp/snmp_exporter.log; then
            echo "::error::snmp_exporter не принял snmp.yml"
            exit 1
          fi
          echo "snmp.yml: экспортёр загрузил конфиг"
