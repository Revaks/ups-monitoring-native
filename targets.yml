# =====================================================================
# СПИСОК ИБП ДЛЯ ОПРОСА
# =====================================================================
# Добавляйте сюда IP-адреса ваших ИБП. Формат:
#
#   - targets:
#       - <IP-адрес ИБП>
#     labels:
#       site: '<территория / площадка>'
#       ups_name: '<человекочитаемое имя>'
#       location: '<расположение / коммутационный узел>'
#
# site — территория (площадка, филиал). По этой метке группы подразделений
#   получают доступ только к «своим» ИБП: группа электриков видит площадку №1,
#   группа операторов — №1 и №2 и так далее. Список территорий группы задаётся
#   в groups.json ключом sites (см. docs/access.md).
#   Пишите название одинаково у всех ИБП одной территории — это точное значение
#   метки, а не шаблон: «Площадка №1» и «площадка 1» — разные территории.
#   ИБП без метки site видны только тем группам, у которых фильтр не задан,
#   и при выборе «All» в переменной «Площадка» на дашборде.
# ups_name — идентификатор ИБП на дашборде (метка instance): по нему строится
#   вкладка «ИБП: …», поэтому имена делайте уникальными. Если имени нет, вкладка
#   называется по IP-адресу; сам адрес всегда виден в метке ups_ip.
# location — колонка «Расположение» в таблице парка: узел, шкаф, этаж.
# labels — необязательны, но с ними дашборд читается заметно лучше.
# Новый ИБП = новый блок ниже: отдельный дашборд создавать не нужно, вкладка на
# дашборде появляется сама (см. docs/dashboard.md).
# После сохранения файла Prometheus подхватит изменения в течение ~30 секунд,
# перезапуск не требуется.
#
# Дополнительные необязательные метки (см. prometheus.yml и snmp.yml):
#   snmp_auth   — имя блока из snmp.yml (auths:), если у этого ИБП другой
#                 community или SNMP v3. По умолчанию public_v2.
#   snmp_module — имя модуля из snmp.yml, если для устройства нужен другой
#                 набор OID. По умолчанию ups.
#   ups_segment — сегмент сети для шардинга опроса (см. docs/scaling.md).
#                 К правам доступа отношения не имеет.
# Например, ИБП с SNMP v3:
#   - targets: [10.0.0.5]
#     labels:
#       site: 'ЦОД-1'
#       ups_name: 'UPS-DC1'
#       location: 'ЦОД-1, ряд 3'
#       snmp_auth: 'dc_v3'
# =====================================================================

# --- Площадка №1 ------------------------------------------------------
- targets:
    - 192.168.1.10
  labels:
    site: 'Площадка №1'
    ups_name: 'UPS-01'
    location: 'Коммутационный узел №1'

- targets:
    - 192.168.1.11
  labels:
    site: 'Площадка №1'
    ups_name: 'UPS-02'
    location: 'Коммутационный узел №2'

# --- Площадка №2 ------------------------------------------------------
- targets:
    - 192.168.2.10
  labels:
    site: 'Площадка №2'
    ups_name: 'UPS-03'
    location: 'Коммутационный узел №1'

- targets:
    - 192.168.2.11
  labels:
    site: 'Площадка №2'
    ups_name: 'UPS-04'
    location: 'Серверная, шкаф 4'
