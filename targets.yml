# =====================================================================
# СПИСОК ИБП ДЛЯ ОПРОСА
# =====================================================================
# Добавляйте сюда IP-адреса ваших ИБП. Формат:
#
#   - targets:
#       - <IP-адрес ИБП>
#     labels:
#       ups_name: '<человекочитаемое имя>'
#       location: '<расположение / коммутационный узел>'
#
# ups_name — идентификатор ИБП на дашборде (метка instance): по нему строится
#   вкладка «ИБП: …», поэтому имена делайте уникальными. Если имени нет, вкладка
#   называется по IP-адресу; сам адрес всегда виден в метке ups_ip.
# location — колонка «Расположение» в таблице парка.
# labels — необязательны, но с ними дашборд читается заметно лучше.
# Новый ИБП = новый блок ниже: отдельный дашборд создавать не нужно, вкладка на
# дашборде появляется сама (см. docs/dashboard.md).
# После сохранения файла Prometheus подхватит изменения в течение ~30 секунд,
# перезапуск не требуется.
#
# Дополнительные необязательные метки (см. prometheus.yml и snmp.yml):
#   snmp_auth   — имя блока из snmp.yml (auths:), если у этого ИБП другой
#                 community или SNMP v3. По умолчанию public_v2.
#   snmp_module — имя модуля из snmp.yml, если для устройства нужен другой
#                 набор OID. По умолчанию ups.
# Например, ИБП с SNMP v3:
#   - targets: [10.0.0.5]
#     labels:
#       ups_name: 'UPS-DC1'
#       location: 'ЦОД-1'
#       snmp_auth: 'dc_v3'
# =====================================================================

- targets:
    - 192.168.1.10
  labels:
    ups_name: 'UPS-01'
    location: 'Коммутационный узел №1'

- targets:
    - 192.168.1.11
  labels:
    ups_name: 'UPS-02'
    location: 'Коммутационный узел №2'
