# Конфигурация Prometheus (нативный запуск без Docker).
#
# Список ИБП задаётся в файле targets.yml (file_sd_configs) рядом с этим файлом —
# его можно менять на лету, Prometheus сам перечитает его без перезапуска.

global:
  scrape_interval: 1m
  scrape_timeout: 30s
  evaluation_interval: 1m

scrape_configs:
  - job_name: 'snmp'
    scrape_interval: 1m
    scrape_timeout: 30s
    metrics_path: /snmp
    params:
      # Значения по умолчанию для всего пула.
      # Их можно переопределить для отдельного ИБП метками snmp_module /
      # snmp_auth в targets.yml (см. relabel_configs ниже).
      module: [ups]
      auth: [public_v2]
    file_sd_configs:
      - files:
          - 'targets.yml'
        refresh_interval: 30s
    relabel_configs:
      # Адрес устройства из targets.yml -> параметр target для snmp_exporter
      - source_labels: [__address__]
        target_label: __param_target
      # Адрес устройства всегда в отдельной метке ups_ip: по ней видно,
      # куда именно ходить, даже когда instance — это имя ИБП.
      - source_labels: [__param_target]
        target_label: ups_ip
      # instance = IP, если в targets.yml не задано ups_name...
      - source_labels: [ups_ip]
        target_label: instance
        regex: (.+)
      # ...и имя устройства, если задано (задавайте уникальные имена!).
      # Так на дашборде и в алертах видно «UPS-DC1», а не «10.0.0.5»,
      # и история не теряется при смене IP.
      - source_labels: [ups_name]
        target_label: instance
        regex: (.+)
      # Необязательные метки ИБП из targets.yml: разные community / SNMP v3
      # и разные модули в одном пуле. Если метки нет — правило не срабатывает
      # и остаётся значение по умолчанию из params выше.
      - source_labels: [snmp_auth]
        target_label: __param_auth
        regex: (.+)
      - source_labels: [snmp_module]
        target_label: __param_module
        regex: (.+)
      # Кто реально опрашивает ИБП — snmp_exporter на этом же сервере.
      #
      # Блок между маркерами run.sh переписывает при каждом запуске:
      #   SNMP_SHARDS = 1 (по умолчанию) — один адрес, порт из SNMP_EXPORTER_PORT;
      #   SNMP_SHARDS > 1 — правила hashmod, которые раскладывают ИБП по
      #   нескольким процессам snmp_exporter (порты SNMP_EXPORTER_PORT..+N-1).
      # Готовая конфигурация кладётся рядом с данными: data/prometheus.yml
      # (см. docs/scaling.md). Правьте этот файл, а не сгенерированный.
      # >>> sharding: начало (переписывается run.sh) >>>
      - target_label: __address__
        replacement: localhost:9116
      # <<< sharding: конец <<<
